# For more details on the format and content:
# https://github.com/joshyorko/rcc/blob/master/docs/recipes.md#what-is-in-condayaml
# Tip: Adding a link to the release notes of the packages helps maintenance and security.

channels:
  - conda-forge

dependencies:
  - python=3.12.11
  - uv=0.13.1
  - pip:
      - robocorp==3.1.4 # https://pypi.org/project/robocorp
      - robocorp-truststore==0.9.1 # https://pypi.org/project/robocorp-truststore
      - rpaframework-assistant==6.0.0 # https://pypi.org/project/rpaframework-assistant
      - requests==2.34.2 # https://pypi.org/project/requests
      - gitpython==3.2.1 # https://pypi.org/project/GitPython
      - pandas==3.0.6 # https://pypi.org/project/pandas
      - beautifulsoup4==4.15.0 # https://pypi.org/project/beautifulsoup4
      - jinja2==3.1.6 # https://pypi.org/project/Jinja2
      - redis==8.1.0 # https://pypi.org/project/redis
      - psycopg2-binary==2.9.13 # https://pypi.org/project/psycopg2-binary
      - SQLAlchemy==2.1.4 # https://pypi.org/project/SQLAlchemy
      - pymongo==4.19.0 # https://pypi.org/project/pymongo
      - actions-work-items==0.4.4 # https://pypi.org/project/actions-work-items
